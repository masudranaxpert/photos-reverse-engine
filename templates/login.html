{% extends "base.html" %}

{% block title %}Sign In • Instant Engine{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="/static/css/auth.css">
{% endblock %}

{% block header %}{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo"><span data-icon="aperture" data-size="30"></span></div>
      <h1 class="auth-title">Engine Control</h1>
      <p class="auth-subtitle">Sign in with administrator credentials</p>
    </div>

    <!-- Error Alert Box -->
    <div id="auth-error" class="auth-error"></div>

    <!-- Login Form -->
    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          class="form-input"
          placeholder="admin"
          required
          autocomplete="username"
          autofocus
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          class="form-input"
          placeholder="••••••••••••"
          required
          autocomplete="current-password"
        >
      </div>

      <button type="submit" id="login-btn" class="btn btn-primary auth-submit-btn">
        Sign In to Engine <span data-icon="arrow-right" data-size="16"></span>
      </button>
    </form>
  </div>
</div>
{% endblock %}
