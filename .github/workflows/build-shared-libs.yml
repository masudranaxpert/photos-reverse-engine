name: Build Shared Libraries & CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-go-engine:
    name: Build Go Core Engine (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            arch: amd64
            runner: windows-latest
            ext: dll
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            ext: so
          - os: darwin
            arch: amd64
            runner: macos-13
            ext: dylib
          - os: darwin
            arch: arm64
            runner: macos-latest
            ext: dylib

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: core/go.mod

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile Go Shared Library
        shell: bash
        run: |
          mkdir -p photos_engine/lib
          OUT="photos_engine/lib/libphotos_engine-${{ matrix.os }}-${{ matrix.arch }}.${{ matrix.ext }}"
          CGO_ENABLED=1 go build -buildmode=c-shared -ldflags="-s -w" -o "$OUT" ./core/cshared

      - name: Upload Library Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libphotos_engine-${{ matrix.os }}-${{ matrix.arch }}
          path: photos_engine/lib/*
