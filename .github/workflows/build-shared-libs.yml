name: Build Shared Libraries & CI
 
on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-go-engine:
    name: Build Go Core & Wheel (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            arch: amd64
            runner: windows-latest
            ext: dll
            plat_tag: win_amd64
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            ext: so
            plat_tag: manylinux_2_17_x86_64
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            ext: so
            plat_tag: manylinux_2_17_aarch64
          - os: darwin
            arch: amd64
            runner: macos-13
            ext: dylib
            plat_tag: macosx_10_9_x86_64
          - os: darwin
            arch: arm64
            runner: macos-14
            ext: dylib
            plat_tag: macosx_11_0_arm64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: go.mod

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Go Tests
        run: go test -v ./core

      - name: Compile Go Shared Library
        shell: bash
        run: |
          mkdir -p photos_engine/lib
          OUT="photos_engine/lib/libphotos_engine-${{ matrix.os }}-${{ matrix.arch }}.${{ matrix.ext }}"
          CGO_ENABLED=1 go build -buildmode=c-shared -ldflags="-s -w" -o "$OUT" ./core/cshared
          rm -f "${OUT%.*}.h"

      - name: Run Python Tests
        shell: bash
        run: |
          python -m unittest discover tests

      - name: Build Platform Wheel
        shell: bash
        run: |
          pip install build wheel
          python -m build --wheel
          cd dist
          for f in *.whl; do
            newname=$(echo "$f" | sed "s/-py3-none-any/-py3-none-${{ matrix.plat_tag }}/")
            mv "$f" "$newname"
          done

      - name: Upload Platform Wheel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.whl

      - name: Upload Native Library Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libphotos_engine-${{ matrix.os }}-${{ matrix.arch }}
          path: photos_engine/lib/*

  release:
    name: Publish Release Assets
    needs: build-go-engine
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist/
          merge-multiple: true

      - name: Download all libraries
        uses: actions/download-artifact@v4
        with:
          pattern: libphotos_engine-*
          path: libs/
          merge-multiple: true

      - name: List Release Files
        run: |
          ls -la dist/
          ls -la libs/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            libs/*
