[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "photos-engine"
version = "0.1.0"
description = "High-performance Google Photos Client with native Go core engine and C-ABI bindings"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Masud Rana", email = "masudranaxpert@gmail.com" }
]
keywords = [
    "google-photos",
    "reverse-engineering",
    "go",
    "cgo",
    "ctypes",
    "unlimited-storage",
    "pixel-spoofing",
    "protobuf"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Go",
    "Operating System :: OS Independent"
]
dependencies = [
    "httpcloak>=1.7.2",
    "selectolax>=0.4.11",
]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
]

[project.scripts]
photos-engine = "photos_engine.cli:main"

[project.urls]
Homepage = "https://masudranaxpert.github.io/photos-reverse-engine/"
Repository = "https://github.com/masudranaxpert/photos-reverse-engine"
Issues = "https://github.com/masudranaxpert/photos-reverse-engine/issues"
Documentation = "https://masudranaxpert.github.io/photos-reverse-engine/"

[tool.setuptools.packages.find]
where = ["."]
include = ["photos_engine*"]
exclude = ["tests*", "core*", "examples*"]

[tool.setuptools.package-data]
photos_engine = ["lib/*"]
