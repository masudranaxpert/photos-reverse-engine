[project]
name = "unlimited-import"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.19.2",
    "apscheduler>=3.11.3",
    "fastapi>=0.141.1",
    "httpcloak>=1.7.2",
    "jinja2>=3.1.6",
    "loguru>=0.7.3",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

