site_name: Photos Engine
site_description: High-performance Google Photos Client with native Go core engine and Python C-ABI bindings
site_author: Masud Rana
site_url: https://masudranaxpert.github.io/photos-reverse-engine/

repo_name: masudranaxpert/photos-reverse-engine
repo_url: https://github.com/masudranaxpert/photos-reverse-engine
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  icon:
    logo: material/image-multiple-outline
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - navigation.path
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - content.action.view

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - toc:
      permalink: "#"
      title: "On this page"
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Getting Started:
      - Quickstart: quickstart.md
      - Development Setup: contributing.md
  - API Reference:
      - Python API: api-reference.md
      - Go Core API: go-api-reference.md
      - CLI Manual: cli-reference.md
  - Architecture:
      - C-ABI & System Design: architecture.md
      - Mobile Reverse Engineering: reverse-engineering.md
